<section class="container my-5">

    <h4 class="text-center text-secondary my-5">Se inscreva no nosso Fã Clube</h4>

    <form name="frminscricao" method="post" action="#">

        <fieldset class="border p-4 mb-4">
            <legend class="w-auto px-2">Dados pessoais</legend>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" name="txtnome" id="nome" class="form-control">
                </div>

                <div class="col-md-6">
                    <label for="fone" class="form-label">Telefone</label>
                    <input type="text" name="txtfone" id="fone" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="nasc" class="form-label">Data de nascimento</label>
                    <input type="date" name="txtnasc" id="nasc" class="form-control">
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" name="txtemail" id="email" class="form-control">
                </div>
            </div>

            <label class="form-label">Qual seu gênero</label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="genero" value="masculino" id="masc">
                <label class="form-check-label" for="masc">Masculino</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="genero" value="feminino" id="fem">
                <label class="form-check-label" for="fem">Feminino</label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="genero" value="outro" id="outro">
                <label class="form-check-label" for="outro">Outro</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="part" value="part" id="part">
                <label class="form-check-label" for="part">
                    Desejo participar do fã-clube
                </label>
            </div>

        </fieldset>

        <fieldset class="border p-4">
            <legend class="w-auto px-2">Comentários</legend>

            <div class="mb-3">
                <label for="comentario" class="form-label">Comentários para o Fã clube</label>
                <textarea name="txacomentario" id="comentario" class="form-control" rows="4"></textarea>
            </div>

            <button type="reset" class="btn btn-secondary">Limpar</button>
            <button type="submit" class="btn btn-primary">Enviar</button>

        </fieldset>

    </form>

</section>
