<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <title>Aprendendo Bootstrap 4.6 no UniSenai</title>
</head>
<body>

    <!-- TIPOS DE BOTÕES -->
    <button class="btn btn-primary">botão</button>
    <button class="btn btn-warning">botão</button>
    <button class="btn btn-link">botão</button>
    <a class="btn btn-primary" href="#">Nosso link</a>
    <button class="btn btn-outline-primary">botão</button>
    <button class="btn btn-primary btn-lg">botão</button> 
    <button class="btn btn-primary">
        <i class="fa fa-user"></i>
        Botão
    </button>
    <button type="button" class="btn btn-primary">
        Profile <span class="badge badge-light">9</span>
    </button>
    <br><br>
    <button class="btn btn-primary btn-block">botão cobre tudo <i class="fa-solid fa-face-smile"></i></button>
    <br>

    <!-- BOTÃO DROPDOWN -->
    <div class="dropdown">
        <button class="btn btn-primary" data-toggle="dropdown">
            Menu Desdobrável
        <i class="fa-solid fa-caret-down"></i></button>
        <div class="dropdown-menu">
            <a href="#" class="dropdown-item">Item 1</a>
            <a href="#" class="dropdown-item">Item 2</a>
            <a href="#" class="dropdown-item">Item 3</a>
        </div>
    </div>
    <br>

    <!-- BOTÃO SELECT GROUP -->
    <div class="btn-group">
        <button class="btn btn-primary">Um</button>
        <button class="btn btn-primary">Dois</button>
        <button class="btn btn-primary">Três</button>
    </div>
    <br><br>

    <!-- LIST -->
    <ul class="list-group list-group-sm">
        <li class="list-group-item">Cras justo odio</li>
        <li class="list-group-item">Dapibus ac facilisis in</li>
        <li class="list-group-item">Morbi leo risus</li>
    </ul>
    <br>

    <!-- SPAN -->
    <span class="badge badge-primary">primary</span>
    <span class="badge badge-secondary">secondary</span>
    <span class="badge badge-sucess">sucess</span>
    <span class="badge badge-danger">danger</span>
    <span class="badge badge-warning">warning</span>
    <span class="badge badge-info">info</span>
    <span class="badge badge-light">light</span>
    <span class="badge badge-dark">dark</span>

    <br>

    <!-- TEXTOS ANIMADOS -->
    <div class="card animated fadeInDown">Morbi leo risus</div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Opotion 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    -->

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
